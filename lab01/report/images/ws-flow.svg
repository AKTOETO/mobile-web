<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" version="1.1" style="background:#FFFFFF;font-family:DejaVu Sans;"><defs><marker id="ah" markerWidth="13" markerHeight="13" refX="11" refY="4.1" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,4.1 L0,9.1 Z" fill="#181818"/></marker></defs><rect x="0" y="0" width="1000" height="560" fill="#FFFFFF"/><text x="500.0" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#000000">Обмен сообщениями приложения Аврора с сервером (канал /ws)</text><rect x="16.0" y="56.0" width="430.0" height="470.0" rx="8" fill="#EFE7FF" stroke="#181818" stroke-width="2.0"/><path d="M24.0,56.0 L316.0,56.0 L326.0,80.0 L16.0,80.0 L16.0,64.0 A8,8 0 0 1 24.0,56.0 Z" fill="#EFE7FF" stroke="#181818" stroke-width="2.0"/><text x="28.0" y="75.0" text-anchor="start" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#000000">Приложение ru.mai.aurorastat</text><rect x="560.0" y="56.0" width="424.0" height="470.0" rx="8" fill="#FFF6E8" stroke="#181818" stroke-width="2.0"/><path d="M568.0,56.0 L892.9,56.0 L902.9,80.0 L560.0,80.0 L560.0,64.0 A8,8 0 0 1 568.0,56.0 Z" fill="#FFF6E8" stroke="#181818" stroke-width="2.0"/><text x="572.0" y="75.0" text-anchor="start" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#000000">Сервер: websocket.js + realtime.js</text><rect x="36.0" y="100.0" width="390.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#181818" stroke-width="1.6"/><text x="231.0" y="128.0" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#000000">StatClient (C++)</text><text x="231.0" y="150.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">QWebSocket · QJsonDocument</text><text x="231.0" y="168.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">QSettings serverUrl</text><rect x="36.0" y="210.0" width="195.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#181818" stroke-width="1.6"/><text x="133.5" y="249.0" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#000000">connectToServer</text><text x="133.5" y="271.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">subscribe range</text><rect x="246.0" y="210.0" width="180.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#181818" stroke-width="1.6"/><text x="336.0" y="249.0" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#000000">trackPageView()</text><text x="336.0" y="271.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">trackAction()</text><rect x="36.0" y="320.0" width="390.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#181818" stroke-width="1.6"/><text x="231.0" y="348.0" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#000000">QML-страницы</text><text x="231.0" y="370.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">MainPage · DashboardPage</text><text x="231.0" y="388.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">SessionsPage · SettingsPage</text><rect x="36.0" y="430.0" width="390.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#181818" stroke-width="1.6"/><text x="231.0" y="459.0" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#000000">Автопереподключение</text><text x="231.0" y="481.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">экспоненциальная задержка ≤ 30 с</text><rect x="580.0" y="100.0" width="384.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#181818" stroke-width="1.6"/><text x="772.0" y="128.0" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#000000">handshake 101</text><text x="772.0" y="150.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">hello: service, protocol</text><text x="772.0" y="168.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">heartbeatSec = 30</text><rect x="580.0" y="210.0" width="180.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#181818" stroke-width="1.6"/><text x="670.0" y="238.0" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#000000">stats</text><text x="670.0" y="260.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">тот же объект,</text><text x="670.0" y="278.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">что GET /api/stats</text><rect x="774.0" y="210.0" width="190.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#181818" stroke-width="1.6"/><text x="869.0" y="238.0" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#000000">update</text><text x="869.0" y="260.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">счётчики</text><text x="869.0" y="278.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">при изменении</text><rect x="580.0" y="320.0" width="185.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#181818" stroke-width="1.6"/><text x="672.5" y="348.0" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#000000">tracked</text><text x="672.5" y="370.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">eventId</text><text x="672.5" y="388.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">sessionId</text><rect x="784.0" y="320.0" width="185.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#181818" stroke-width="1.6"/><text x="876.5" y="348.0" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#000000">ping → pong</text><text x="876.5" y="370.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">кадр ping</text><text x="876.5" y="388.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">каждые 30 с</text><rect x="580.0" y="430.0" width="384.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#181818" stroke-width="1.6"/><text x="772.0" y="459.0" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#000000">error</text><text x="772.0" y="481.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">некорректное сообщение или тип</text><path d="M446.0,140.0 L560.0,140.0" fill="none" stroke="#181818" stroke-width="1.8" marker-end="url(#ah)"/><path d="M446.0,250.0 L560.0,250.0" fill="none" stroke="#181818" stroke-width="1.8" marker-end="url(#ah)"/><path d="M446.0,360.0 L560.0,360.0" fill="none" stroke="#181818" stroke-width="1.8" marker-end="url(#ah)"/><path d="M560.0,190.0 L446.0,190.0" fill="none" stroke="#181818" stroke-width="1.8" marker-end="url(#ah)"/><path d="M560.0,300.0 L446.0,300.0" fill="none" stroke="#181818" stroke-width="1.8" marker-end="url(#ah)"/><path d="M560.0,400.0 L446.0,400.0" fill="none" stroke="#181818" stroke-width="1.8" marker-end="url(#ah)"/><text x="503.0" y="122.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">subscribe</text><text x="503.0" y="172.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">hello + stats</text><text x="503.0" y="232.0" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#000000">track</text><text x="503.0" y="282.0" text-anchor="middle" font-family="DejaVu Sans" font-size="1