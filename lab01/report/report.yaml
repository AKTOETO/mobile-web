  assets_dir: assets
  title_example: ""
  logo: ""

page:
  width_twips: 11906               # A4
  height_twips: 16838
  margin_left_cm: 3.0
  margin_right_cm: 1.5
  margin_top_cm: 2.0
  margin_bottom_cm: 2.0
  footer_cm: 1.0

fonts:
  serif: Times New Roman
  mono: Courier New
  body_pt: 14
  heading_pt: 14
  table_pt: 12
  caption_pt: 12
  code_pt: 10
  footer_pt: 12
